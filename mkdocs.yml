site_name: Deep RL 课程中文版(deep-rl-class-zh)
site_description: deep-rl-class 的中文版本课程 — Hugging Face 深度强化学习课程全 114 页简体中文翻译(9 个正式单元 + 3 个附加单元),在线阅读:https://bald0wang.github.io/deep-rl-class-zh/
site_author: Bald0Wang
site_url: https://bald0wang.github.io/deep-rl-class-zh/
repo_url: https://github.com/Bald0Wang/deep-rl-class-zh
repo_name: Bald0Wang/deep-rl-class-zh
edit_uri: ""
copyright: 原课程 © Hugging Face(Apache-2.0)· 译文由 AI 辅助生成,仅供学习交流

theme:
  name: material
  language: zh
  font: false
  icon:
    logo: material/school
  features:
    - content.code.copy
    - content.code.select
    - content.tooltips
    - header.autohide
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 浅色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 深色模式

plugins:
  - search:
      lang: zh

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/theme-fallback.js
  - javascripts/sidebar-fold.js
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/custom.css

